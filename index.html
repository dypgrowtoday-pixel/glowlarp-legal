<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glowlarp</title>
<meta name="description" content="Glowlarp shows which haircut suits your face and lets you try it on your own photo before you cut.">
<style>:root{--bg:#06070F;--surface:#10121F;--border:rgba(154,163,255,.18);--primary:#4F5BFF;--accent:#9AA3FF;--text:#fff;--muted:rgba(255,255,255,.64)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{overflow-wrap:break-word;margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-image:radial-gradient(ellipse 80% 40% at 50% 100%,rgba(79,91,255,.25),transparent);display:flex;align-items:center}
.wrap{max-width:560px;margin:0 auto;padding:48px 16px;text-align:center;width:100%}
.brand{font-weight:800;letter-spacing:.12em;color:var(--accent);font-size:15px;margin-bottom:16px}
h1{font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
p{color:var(--muted);margin:0 0 24px}
a{color:var(--accent)}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.links a{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:12px 22px;text-decoration:none;color:var(--text);font-weight:600}
.mail{font-size:15px}</style></head>
<body><main class="wrap">
<div class="brand">GLOWLARP</div>
<h1>See your best haircut before you cut</h1>
<p>Glowlarp shows which haircut suits your face and lets you try it on your own photo.</p>
<div class="links"><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Use</a></div>
<p class="mail">Support: <a href="mailto:glowlarp.app@gmail.com">glowlarp.app@gmail.com</a></p>
<p class="mail"><a href="/delete-account">Delete your account and data</a></p>
</main></body></html>
